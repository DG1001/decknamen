[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decknamen"
version = "0.1.0"
description = "Dokumente (Markdown, Word, PDF) mit einem lokalen Sprachmodell pseudonymisieren"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]

[project.scripts]
decknamen = "decknamen.__main__:main"

[tool.setuptools]
packages = ["decknamen"]

[tool.setuptools.package-data]
decknamen = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
